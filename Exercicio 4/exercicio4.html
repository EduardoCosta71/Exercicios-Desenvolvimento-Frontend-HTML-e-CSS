<body>

    <script>

        let valor1 = parseInt(prompt("Digite o valo 1: "));
        let valor2 = parseInt(prompt("Digite o valor 2: "));

        if (valor1 && valor2 <= 0){

            alert("Digite um número inteiro.");

        } else{

            let resultado;
            
        resultado = valor1 + valor2;

        alert("O resultado da soma dos valores 1 e 2 são: " + resultado);

        }


    </script>
