    <script>

        let numero = parseInt(prompt("Digite um número inteiro: "));

        if (numero <= 0){
            
            alert("Escreva um número inteiro.")

        } else{

            let resultado;

        resultado = numero *2;

        alert("O dobro do número: " + numero +  " é: " + resultado);

        }

    </script>
