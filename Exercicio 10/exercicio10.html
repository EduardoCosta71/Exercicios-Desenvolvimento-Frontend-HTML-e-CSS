<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 10</title>
</head>
<body>

    <script>

        let altDegr = parseFloat(prompt("Digite a altura do Degrau: "));
        let altura = parseFloat(prompt("Digite a altura que deseja alcançar: "));

        // Math.ceil arredonda o resultado para cima
        let totalDegraus = Math.ceil(altura / altDegr);

        alert("Para atinjir o objetivo o pedreiro deve subir: " + totalDegraus + " Degraus.");



    </script>

    
</body>
</html>
