<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista Ordenada</title>
</head>
<body>
    <!-- Lista ordenada -->
    <h1>Lista ordenada</h1>

    <ol>
         <li>Primeiro passo</li>
        <li>Segundo passo</li>
        <li>Terceiro passo</li>
    
    </ol>

    <hr>
    <!-- Lista não ordenada-->

     <h1>Lista não ordenada</h1>

    <ul style="list-style-type:square;">
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </ul>

    <!-- Tabela -->

    <table border="5">

        <thead>

            <tr>

                <th>Nome</th>
                <th>Idade</th>
                <th>Cidade</th>

            </tr>

            </thead>

            <tbody>

            <tr>

                <th>Dudu</th>
                <th>90</th>
                <th>Bahia</th>

            </tr>
            
            </tbody>

        </thead>

    </table>
    
    <hr>

    <h1>A natureza é linda!</h1>
    <img src="natureza.jpg" widht="300" height="300 " >
</body>
</html>
